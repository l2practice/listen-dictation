<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LisDictation — Language Hub</title>
<link rel="stylesheet" href="ld-theme.css">
<meta http-equiv="refresh" content="0; url=login.html">
</head>
<body>
<div class="ld-auth-wrap">
  <div class="ld-auth-card" style="text-align:center">
    <div class="ld-brand">Language <em>Hub</em></div>
    <div class="ld-auth-title">🎧 LisDictation</div>
    <p class="ld-auth-sub">Redirecting…</p>
  </div>
</div>

<script src="ld-common.js"></script>
<script>
// index.html only exists so GitHub Pages has a root file to serve (required for directory-style URLs).
// Already logged in → go straight to the right page. Not logged in → login.html (the <meta refresh> above covers the case where JS fails).
(function () {
  if (typeof LD === 'undefined') { location.href = 'login.html'; return; }
  var s = LD.session.get();
  location.href = (s && s.user && s.user.role === 'Teacher') ? LD.TEACHER_HOME : (s && s.user ? LD.STUDENT_HOME : LD.LOGIN_PAGE);
})();
</script>
</body>
</html>
